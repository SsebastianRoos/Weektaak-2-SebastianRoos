
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodge Rush</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101326;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
h1 { color: #66e5ff; margin: 18px 0 8px; }
#score { font-size: 22px; margin: 10px; }
canvas {
  background: #191e38;
  border: 3px solid #66e5ff;
  border-radius: 12px;
  max-width: 95vw;
  touch-action: none;
}
button {
  background: #66e5ff;
  color: #101326;
  border: none;
  padding: 12px 25px;
  border-radius: 9px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 12px;
}
p { color: #b8c2df; }
</style>
</head>
<body>

<h1>⚡ DODGE RUSH</h1>
<div id="score">Score: 0</div>
<canvas id="game" width="400" height="550"></canvas>
<br>
<button onclick="startGame()">START / RESTART</button>
<p>Move with ← → or A / D. On mobile, drag your finger!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

let player, blocks, score, running, gameOver;
let keys = {};
let spawnTimer, animation;

function startGame() {
  cancelAnimationFrame(animation);
  player = { x: 180, y: 485, w: 40, h: 40, speed: 6 };
  blocks = [];
  score = 0;
  spawnTimer = 0;
  running = true;
  gameOver = false;
  loop();
}

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});
document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("pointermove", e => {
  if (!running) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * canvas.width / rect.width;
  player.x = Math.max(0, Math.min(360, x - 20));
});

function loop() {
  if (!running) return;

  ctx.clearRect(0, 0, 400, 550);

  // Background stars
  ctx.fillStyle = "#303b61";
  for (let i = 0; i < 30; i++) {
    const x = (i * 83) % 400;
    const y = (i * 137 + score * 2) % 550;
    ctx.fillRect(x, y, 2, 2);
  }

  // Player movement
  if (keys["arrowleft"] || keys["a"]) player.x -= player.speed;
  if (keys["arrowright"] || keys["d"]) player.x += player.speed;
  player.x = Math.max(0, Math.min(360, player.x));

  // Draw player
  ctx.shadowBlur = 20;
  ctx.shadowColor = "#66e5ff";
  ctx.fillStyle = "#66e5ff";
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  // Spawn blocks
  spawnTimer++;
  if (spawnTimer > Math.max(16, 45 - score / 8)) {
    blocks.push({
      x: Math.random() * 360,
      y: -30,
      size: 25 + Math.random() * 25,
      speed: 3 + Math.random() * 2 + score / 100
    });
    spawnTimer = 0;
  }

  // Move and draw blocks
  for (let i = blocks.length - 1; i >= 0; i--) {
    let b = blocks[i];
    b.y += b.speed;

    ctx.fillStyle = "#ff476f";
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#ff476f";
    ctx.fillRect(b.x, b.y, b.size, b.size);
    ctx.shadowBlur = 0;

    // Collision
    if (
      player.x < b.x + b.size &&
      player.x + player.w > b.x &&
      player.y < b.y + b.size &&
      player.y + player.h > b.y
    ) {
      endGame();
      return;
    }

    if (b.y > 550) {
      blocks.splice(i, 1);
      score++;
    }
  }

  scoreText.textContent = "Score: " + score;
  animation = requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  gameOver = true;

  ctx.fillStyle = "rgba(0,0,0,0.75)";
  ctx.fillRect(0, 0, 400, 550);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ff476f";
  ctx.font = "bold 42px Arial";
  ctx.fillText("GAME OVER", 200, 245);

  ctx.fillStyle = "white";
  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 200, 290);

  ctx.font = "17px Arial";
  ctx.fillText("Press START to play again", 200, 335);
}

ctx.fillStyle = "#66e5ff";
ctx.font = "bold 25px Arial";
ctx.textAlign = "center";
ctx.fillText("DODGE RUSH", 200, 240);
ctx.font = "16px Arial";
ctx.fillStyle = "white";
ctx.fillText("Press START to begin!", 200, 280);
</script>
</body>
</html>
